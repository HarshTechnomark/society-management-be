name: CI
# Paused: runs only when started by hand from the Actions tab (no automatic runs, no emails).
# To turn automatic checks back on, restore the pull_request and push triggers for dev and main.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: societyapp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/societyapp_test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The tests read .env.test, which is not committed; use the committed test-only values.
      - run: cp .env.test.example .env.test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run migrate
      - run: npm run migrate:undo:all && npm run migrate
      - run: npm test
      - run: npm run build
